name: render-preview

on:
  pull_request:
    paths:
      - ".github/workflows/render-preview.yml"
      - "apps/web/data/replit-design-storyboard-package.json"
      - "apps/worker/src/build-render-preview-package.mjs"
      - "apps/worker/src/render-preview-video.mjs"
      - "apps/worker/src/run-video-quality-gate.mjs"
      - "packages/render-preview/**"
      - "packages/video-gold-profile/**"
      - "packages/video-quality-gate/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-preview.yml"
      - "apps/web/data/replit-design-storyboard-package.json"
      - "apps/worker/src/build-render-preview-package.mjs"
      - "apps/worker/src/render-preview-video.mjs"
      - "apps/worker/src/run-video-quality-gate.mjs"
      - "packages/render-preview/**"
      - "packages/video-gold-profile/**"
      - "packages/video-quality-gate/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deterministic media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng librsvg2-bin fonts-noto-cjk
      - run: npm install --ignore-scripts
      - name: Build source-bound render package
        run: npm run production:render-package:replit
      - name: Render 9:16 MP4 preview
        run: npm run production:render-preview:replit
      - name: Run M10 automated video quality gate
        run: npm run production:quality-gate:replit
      - name: Verify release remains blocked
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("build/replit-design-video-quality-report.json", "utf8"));
          if (report.automatedGate !== "PASS") throw new Error("automated video QA failed");
          if (report.releaseDecision !== "BLOCKED" || report.publicationAllowed !== false) {
            throw new Error("preview must remain blocked from release");
          }
          const required = [
            "OWNED_SCREEN_RECORDINGS_REQUIRED",
            "FINAL_VOICE_APPROVAL_REQUIRED",
            "HUMAN_QUALITY_REVIEW_REQUIRED",
          ];
          for (const blocker of required) {
            if (!report.releaseBlockers.includes(blocker)) throw new Error(`missing required release blocker: ${blocker}`);
          }
          const goldPending = report.qualityProfile === "video.production.gold-baseline.v1" && report.qualityStage === "TARGET_PENDING";
          if (goldPending && !report.releaseBlockers.includes("GOLD_CREATIVE_REVIEW_REQUIRED")) {
            throw new Error("Gold target preview must remain blocked for creative review");
          }
          const allowed = new Set([...required, "GOLD_CREATIVE_REVIEW_REQUIRED"]);
          const unexpected = report.releaseBlockers.filter((blocker) => !allowed.has(blocker));
          if (unexpected.length) throw new Error(`unexpected release blockers: ${unexpected.join(", ")}`);
          console.log(report);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: toolradar-replit-design-render-preview
          retention-days: 14
          if-no-files-found: error
          path: |
            build/replit-design-preview.mp4
            build/replit-design-preview.srt
            build/replit-design-render-preview-package.json
            build/replit-design-render-receipt.json
            build/replit-design-video-quality-report.json
            build/gold-creative-quality-pending.json
