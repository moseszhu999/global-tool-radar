name: replit-owned-media-task-pack

on:
  pull_request:
    paths:
      - 'packages/replit-owned-media-task-pack/**'
      - 'apps/worker/src/build-replit-owned-media-task-pack.mjs'
      - 'apps/web/data/replit-design-production-case.json'
      - 'apps/web/data/replit-design-storyboard-package.json'
      - 'apps/web/data/replit-design-video-project-ledger.json'
      - 'apps/remotion-video/props/final.json'
      - '.github/workflows/replit-owned-media-task-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-task-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package syntax
        run: npm --prefix packages/replit-owned-media-task-pack run check
      - name: Package contract tests
        run: npm --prefix packages/replit-owned-media-task-pack test
      - name: Generate owned-media task pack
        env:
          TOOLRADAR_OWNED_MEDIA_TASK_PACK_OUTPUT: artifacts/replit-owned-media-task-pack.json
        run: node apps/worker/src/build-replit-owned-media-task-pack.mjs
      - name: Verify human work and render boundaries
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {validateReplitOwnedMediaTaskPack} from './packages/replit-owned-media-task-pack/src/index.mjs';
          const pack = JSON.parse(await readFile('artifacts/replit-owned-media-task-pack.json', 'utf8'));
          validateReplitOwnedMediaTaskPack(pack);
          if (pack.status !== 'HUMAN_MEDIA_WORK_REQUIRED') throw new Error('task pack status changed');
          if (pack.finalRenderAllowed !== false) throw new Error('task pack cannot authorize rendering');
          if (pack.files.length !== 3) throw new Error('expected exactly three media files');
          if (!pack.preflight.command.includes('REMOTION_VOICEOVER_VERIFIED="true"')) throw new Error('preflight verification command missing');
          if (pack.files.some((item) => item.currentState === 'VERIFIED')) throw new Error('task pack fabricated file verification');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: toolradar-replit-owned-media-task-pack
          path: artifacts/replit-owned-media-task-pack.json
          if-no-files-found: error
          retention-days: 30
