# isolated quality-casting / carrier validation 2026-08-18
name: AI Video Voice Carrier Evidence
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ai-video-quality-casting.yml

permissions:
  contents: read

jobs:
  validate-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARRIER_REPO: moseszhu999/training-learning-rails
      CARRIER_HEAD: 0d2ff4df5fe073f7d13304bd7127de4f05eda43a
      CARRIER_DIR: tmp/ai-video-voice-casting-20260811
    steps:
      - name: Validate persisted voice candidates from existing MacRunner carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice-carrier-evidence
          base="https://raw.githubusercontent.com/${CARRIER_REPO}/${CARRIER_HEAD}/${CARRIER_DIR}"

          cat > voice-carrier-evidence/expected-sha256.txt <<'EOF'
          cc9578327fff9a7125c004722de6c2247f449085ddab4c7ae8912433795f48c6  audition-flo.m4a
          f73f3147b2a926ec89021d282d18b3ab542bb9b938ff413c0580c4f0f61592ef  audition-shelley.m4a
          2f62445f2d830161988612a06bd969de62b2cca774eb5e55fa9a129403989425  audition-tingting.m4a
          14bafbce3bac2c9e8edef1dd7f8bac6ec1b0de7b92c003aa348cec470bcc92eb  narration-flo-full.m4a
          EOF

          while read -r expected file; do
            curl --fail --location --silent --show-error \
              "${base}/${file}" \
              --output "voice-carrier-evidence/${file}"
            actual="$(sha256sum "voice-carrier-evidence/${file}" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "SHA mismatch for ${file}: expected ${expected}, got ${actual}" >&2
              exit 3
            fi
          done < voice-carrier-evidence/expected-sha256.txt

          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('voice-carrier-evidence')
          samples = []
          for path in sorted(root.glob('*.m4a')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              samples.append({
                  'file': path.name,
                  'bytes': path.stat().st_size,
                  'sha256': digest,
              })
          manifest = {
              'schemaVersion': 'toolradar.voice-carrier-evidence.v1',
              'carrierRepo': os.environ['CARRIER_REPO'],
              'carrierHead': os.environ['CARRIER_HEAD'],
              'carrierDirectory': os.environ['CARRIER_DIR'],
              'selectionStatus': 'HUMAN_REVIEW_REQUIRED',
              'finalVoiceApproval': False,
              'publicationAllowed': False,
              'samples': samples,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Upload bounded carrier evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-voice-carrier-evidence-20260818
          path: voice-carrier-evidence/
          retention-days: 7
