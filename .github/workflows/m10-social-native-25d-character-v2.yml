name: M10 Social Native 2.5D Character v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - apps/remotion-video/src/social-native-25d-character-v3.tsx
      - .github/workflows/m10-social-native-25d-character-v2.yml

permissions:
  contents: read

jobs:
  render:
    name: Render richer 2.5D character studio candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_FRAMES: '884'
      EXPECTED_FPS: '30'
      EXPECTED_WIDTH: '1080'
      EXPECTED_HEIGHT: '1920'
      VOICE: zh-CN-XiaoxiaoNeural
      VOICE_RATE: '+10%'
    steps:
      - name: Validate candidate carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "moseszhu999/global-tool-radar"
          test "$GITHUB_HEAD_REF" = "feat/social-native-25d-character-v2"

      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"

      - name: Install media, CJK font, and neural TTS tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk python3-pip
          sudo fc-cache -f
          fc-match 'Noto Sans CJK SC' | tee "$RUNNER_TEMP/cjk-font-match.txt"
          grep -F 'NotoSansCJK' "$RUNNER_TEMP/cjk-font-match.txt" >/dev/null
          python3 -m pip install --user --disable-pip-version-check edge-tts
          python3 -m edge_tts --help >/dev/null

      - name: Generate natural narration, richer SFX, and original BGM
        shell: bash
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/apps/remotion-video/public/assets/social-native-25d-v3"
          mkdir -p "$dir"
          texts=(
            '这页面丑到我都不想点。三刀，救回来。'
            '问题就三个：信息太挤，颜色太吵，按钮太多。'
            '第一刀，砍信息。没用的卡片，直接扫出去。'
            '第二刀，砍颜色。七种颜色，收成三套。'
            '第三刀，只留一个主按钮。别让用户猜。'
            '看前后。左边像仓库，右边终于像产品。'
            'AI不替你审美，但能让你试错更快。你选哪边？'
          )
          names=(01-hook 02-problem 03-cut-info 04-cut-color 05-one-cta 06-reveal 07-payoff)
          : > "$RUNNER_TEMP/voice-timings.tsv"
          for i in "${!texts[@]}"; do
            mp3="$RUNNER_TEMP/${names[$i]}.mp3"
            wav="$dir/${names[$i]}.wav"
            ok=0
            for attempt in 1 2 3; do
              if python3 -m edge_tts --voice "$VOICE" --rate "$VOICE_RATE" --text "${texts[$i]}" --write-media "$mp3" && test -s "$mp3"; then ok=1; break; fi
              rm -f "$mp3"
              sleep $((attempt * 2))
            done
            test "$ok" -eq 1
            ffmpeg -hide_banner -loglevel error -y -i "$mp3" -ar 48000 -ac 2 -c:a pcm_s16le "$wav"
            sha="$(sha256sum "$wav" | awk '{print $1}')"
            python3 - "$wav" "${names[$i]}" "$sha" >> "$RUNNER_TEMP/voice-timings.tsv" <<'PY'
          import array, math, sys, wave
          path, name, sha = sys.argv[1:4]
          with wave.open(path, 'rb') as w:
              rate, channels, nframes = w.getframerate(), w.getnchannels(), w.getnframes()
              raw = w.readframes(nframes)
          samples = array.array('h'); samples.frombytes(raw)
          window = max(1, int(rate * 0.02)); active=[]
          for start in range(0,nframes,window):
              end=min(nframes,start+window); acc=0.0; count=0
              for f in range(start,end):
                  for ch in range(channels):
                      v=samples[f*channels+ch]; acc+=v*v; count+=1
              if math.sqrt(acc/max(1,count)) >= 180.0: active.append((start,end))
          if not active: raise SystemExit(f'no audible speech detected in {name}')
          speech_start=active[0][0]/rate; speech_end=active[-1][1]/rate; duration=nframes/rate
          print(f'{name}\t{duration:.6f}\t{speech_start:.6f}\t{speech_end:.6f}\t{sha}')
          PY
          done
          cat "$RUNNER_TEMP/voice-timings.tsv"

          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=82:sample_rate=48000:duration=0.30' -af 'afade=t=out:st=0.05:d=0.25,volume=0.72' -ac 2 -c:a pcm_s16le "$dir/impact.wav"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'anoisesrc=color=pink:sample_rate=48000:duration=0.40' -af 'highpass=f=520,lowpass=f=7000,afade=t=in:st=0:d=0.025,afade=t=out:st=0.13:d=0.27,volume=0.20' -ac 2 -c:a pcm_s16le "$dir/whoosh.wav"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=1080:sample_rate=48000:duration=0.11' -af 'afade=t=out:st=0.02:d=0.09,volume=0.27' -ac 2 -c:a pcm_s16le "$dir/click.wav"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=1320:sample_rate=48000:duration=0.50' -af 'aecho=0.8:0.35:42|88:0.32|0.18,afade=t=out:st=0.22:d=0.28,volume=0.16' -ac 2 -c:a pcm_s16le "$dir/sparkle.wav"

          python3 - "$dir/bgm.wav" "$EXPECTED_FRAMES" "$EXPECTED_FPS" <<'PY'
          import array, math, sys, wave
          out, frames, fps = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          rate=48000; n=rate*frames//fps; bpm=116.0; beat=60.0/bpm
          roots=(110.0,130.81,146.83,98.0); buf=array.array('h')
          for j in range(n):
              t=j/rate; root=roots[int(t//3.68)%len(roots)]
              pad=(math.sin(2*math.pi*root*t)+0.55*math.sin(2*math.pi*root*1.5*t)+0.35*math.sin(2*math.pi*root*2*t))*0.045
              bp=t%beat
              kick=(math.sin(2*math.pi*(72-24*min(1,bp/.15))*bp)*math.exp(-24*bp)*0.28) if bp<.18 else 0.0
              hb=t%(beat/2); hat=(math.sin(2*math.pi*5210*t)*math.sin(2*math.pi*3170*t)*math.exp(-65*hb)*0.045) if hb<.07 else 0.0
              beat_index=int(t/beat)%4; snp=t%beat
              snare=(math.sin(2*math.pi*1780*t)*math.sin(2*math.pi*1230*t)*math.exp(-28*snp)*0.075) if beat_index in (1,3) and snp<.16 else 0.0
              lift=0.018*math.sin(2*math.pi*(220 if beat_index<2 else 247)*t)
              v=max(-.85,min(.85,pad+kick+hat+snare+lift)); s=int(v*32767)
              buf.append(s); buf.append(s)
          with wave.open(out,'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate); w.writeframes(buf.tobytes())
          PY
          test -s "$dir/bgm.wav"

      - name: Validate speech against native 884-frame slots
        shell: bash
        run: |
          set -euo pipefail
          slot_frames=(118 132 138 123 118 123 132)
          i=0; total=0
          while IFS=$'\t' read -r name duration speech_start speech_end sha; do
            frames="${slot_frames[$i]}"; total=$((total+frames))
            slot_seconds="$(node -e 'console.log(Number(process.argv[1])/30)' "$frames")"
            printf '%s speech=%s..%ss slot=%ss frames=%s sha=%s\n' "$name" "$speech_start" "$speech_end" "$slot_seconds" "$frames" "$sha"
            node -e 'const end=+process.argv[1],slot=+process.argv[2];if(!(end+0.10<slot)){console.error(`speech exceeds slot end=${end} slot=${slot}`);process.exit(1)}' "$speech_end" "$slot_seconds"
            i=$((i+1))
          done < "$RUNNER_TEMP/voice-timings.tsv"
          test "$i" -eq 7
          test "$total" -eq "$EXPECTED_FRAMES"

      - name: Install Remotion dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd apps/remotion-video
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Create isolated v3 entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/remotion-video/src/social-native-25d-v3-entry.tsx <<'TSX'
          import React from 'react';
          import {Composition,registerRoot} from 'remotion';
          import {SOCIAL_NATIVE_25D_V3_FPS,SOCIAL_NATIVE_25D_V3_FRAMES,ToolRadarSocialNative25DCharacterV3} from './social-native-25d-character-v3';
          const Root:React.FC=()=> <Composition id="ToolRadarSocialNative25DCharacterV3" component={ToolRadarSocialNative25DCharacterV3} durationInFrames={SOCIAL_NATIVE_25D_V3_FRAMES} fps={SOCIAL_NATIVE_25D_V3_FPS} width={1080} height={1920}/>;
          registerRoot(Root);
          TSX

      - name: Bundle and verify native v3 composition
        shell: bash
        run: |
          set -euo pipefail
          cd apps/remotion-video
          npx remotion compositions src/social-native-25d-v3-entry.tsx | tee "$RUNNER_TEMP/v3-compositions.txt"
          grep -F 'ToolRadarSocialNative25DCharacterV3' "$RUNNER_TEMP/v3-compositions.txt" >/dev/null
          grep -F "$EXPECTED_FRAMES" "$RUNNER_TEMP/v3-compositions.txt" >/dev/null

      - name: Render richer 2.5D studio candidate
        shell: bash
        run: |
          set -euo pipefail
          cd apps/remotion-video
          mkdir -p out
          npx remotion render src/social-native-25d-v3-entry.tsx ToolRadarSocialNative25DCharacterV3 out/toolradar-social-native-25d-character-v3.mp4 --codec=h264 --crf=18
          test -s out/toolradar-social-native-25d-character-v3.mp4

      - name: Run M10 technical, pacing, and loudness preflight
        shell: bash
        run: |
          set -euo pipefail
          video="$GITHUB_WORKSPACE/apps/remotion-video/out/toolradar-social-native-25d-character-v3.mp4"
          ffprobe -v error -show_streams -show_format -of json "$video" > "$RUNNER_TEMP/v3-ffprobe.json"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$video" > "$RUNNER_TEMP/v3-frame-count.txt"
          ffmpeg -hide_banner -nostats -i "$video" -vf 'blackdetect=d=0.35:pix_th=0.10' -an -f null - 2> "$RUNNER_TEMP/v3-blackdetect.txt" || true
          ffmpeg -hide_banner -nostats -i "$video" -af 'silencedetect=noise=-45dB:d=0.75' -vn -f null - 2> "$RUNNER_TEMP/v3-silencedetect.txt" || true
          ffmpeg -hide_banner -nostats -i "$video" -af 'loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json' -f null - 2> "$RUNNER_TEMP/v3-loudness.txt" || true
          ffmpeg -hide_banner -loglevel error -y -i "$video" -vf 'fps=1/3.683333,scale=270:480,tile=2x4:padding=8:margin=8' -frames:v 1 "$RUNNER_TEMP/v3-contact-sheet.jpg"

          VIDEO="$video" PR_HEAD="${{ github.event.pull_request.head.sha }}" node --input-type=module <<'NODE'
          import {readFile,writeFile,stat} from 'node:fs/promises'; import {createHash} from 'node:crypto';
          const probe=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/v3-ffprobe.json','utf8'));
          const vs=probe.streams.find(s=>s.codec_type==='video'), as=probe.streams.find(s=>s.codec_type==='audio');
          if(!vs||!as) throw new Error('video+audio required');
          if(+vs.width!==+process.env.EXPECTED_WIDTH||+vs.height!==+process.env.EXPECTED_HEIGHT) throw new Error('unexpected dimensions');
          const frames=Number((await readFile(process.env.RUNNER_TEMP+'/v3-frame-count.txt','utf8')).trim());
          if(frames!==+process.env.EXPECTED_FRAMES) throw new Error(`unexpected frame count ${frames}`);
          const duration=frames/(+process.env.EXPECTED_FPS), container=+probe.format.duration;
          if(!(container>=duration&&container<duration+0.15)) throw new Error(`unexpected container duration ${container}`);
          const bytes=await readFile(process.env.VIDEO);
          const receipt={schemaVersion:'toolradar.m10.social-native-25d-character.v3',exactCandidateHead:process.env.PR_HEAD,format:'9:16 portrait',visualMode:'richer 2.5D character studio + environmental props + depth/parallax + lighting',selectedVoice:process.env.VOICE,voiceRate:process.env.VOICE_RATE,narrationTimeStretchApplied:false,authoredDeadAirCutBakedIntoTimeline:true,proceduralMusicIncluded:true,proceduralSfxIncluded:['impact','whoosh','click','sparkle'],thirdPartyVisualAssetsUsed:false,outputFilename:'toolradar-social-native-25d-character-v3.mp4',outputSha256:createHash('sha256').update(bytes).digest('hex'),outputBytes:(await stat(process.env.VIDEO)).size,frames,fps:+process.env.EXPECTED_FPS,durationSeconds:duration,containerDurationSeconds:container,width:+vs.width,height:+vs.height,technicalMediaIntegrityPassed:true,socialPacingSilenceGatePassed:true,humanWatchedFullCandidate:false,socialPlatformBusinessFitApprovedByHuman:false,publicationAllowed:false,publicationPerformed:false,analyticsObserved:false};
          await writeFile(process.env.RUNNER_TEMP+'/v3-receipt.json',JSON.stringify(receipt,null,2)+'\n'); console.log(JSON.stringify(receipt,null,2));
          NODE
          if grep -F 'black_start:' "$RUNNER_TEMP/v3-blackdetect.txt" >/dev/null; then echo 'black interval gate failed' >&2; cat "$RUNNER_TEMP/v3-blackdetect.txt" >&2; exit 1; fi
          if grep -F 'silence_start:' "$RUNNER_TEMP/v3-silencedetect.txt" >/dev/null; then echo 'social pacing silence gate failed' >&2; cat "$RUNNER_TEMP/v3-silencedetect.txt" >&2; exit 1; fi

      - name: Upload richer v3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: toolradar-social-native-25d-character-v3
          path: |
            apps/remotion-video/out/toolradar-social-native-25d-character-v3.mp4
            ${{ runner.temp }}/v3-contact-sheet.jpg
            ${{ runner.temp }}/v3-receipt.json
            ${{ runner.temp }}/v3-ffprobe.json
            ${{ runner.temp }}/v3-frame-count.txt
            ${{ runner.temp }}/v3-blackdetect.txt
            ${{ runner.temp }}/v3-silencedetect.txt
            ${{ runner.temp }}/v3-loudness.txt
            ${{ runner.temp }}/voice-timings.tsv
            ${{ runner.temp }}/cjk-font-match.txt
          if-no-files-found: error
          retention-days: 14
