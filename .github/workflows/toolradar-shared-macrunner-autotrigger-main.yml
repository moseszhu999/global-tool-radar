name: ToolRadar Shared MacRunner Auto Trigger Main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/toolradar-shared-macrunner-autotrigger-main.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: toolradar-shared-macrunner-autotrigger-main
  cancel-in-progress: true

jobs:
  latest-main:
    name: latest-main / ${{ github.sha }}
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 60
    env:
      CI: "true"
      TOOLRADAR_EXACT_HEAD: ${{ github.sha }}
      TOOLRADAR_MACRUNNER_BASE_URL: http://127.0.0.1:8765
    steps:
      - name: Validate repository and ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "moseszhu999/global-tool-radar"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$TOOLRADAR_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact latest main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Prove exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLRADAR_EXACT_HEAD"
          test -z "$(git status --porcelain)"

      - name: Reject production capabilities
        shell: bash
        run: |
          set -euo pipefail
          env | cut -d= -f1 | grep -E '(^|_)(PRODUCTION|PROD|SERVICE_ROLE|BILLING|PAYMENT|STRIPE)(_|$)' && exit 1 || true

      - name: Require Node 22
        shell: bash
        run: node -e 'const major=Number(process.versions.node.split(".")[0]); if (major !== 22) process.exit(1)'

      - name: Validate shared MacRunner controller
        shell: bash
        run: |
          npm --prefix packages/shared-macrunner-controller run check
          npm --prefix packages/shared-macrunner-controller test

      - name: Probe shared MacRunner health and OpenAPI contract
        shell: bash
        run: |
          set -euo pipefail
          node packages/shared-macrunner-controller/src/cli.mjs probe \
            --base-url "$TOOLRADAR_MACRUNNER_BASE_URL" \
            --output "$RUNNER_TEMP/toolradar-shared-macrunner-contract.json"
          cat "$RUNNER_TEMP/toolradar-shared-macrunner-contract.json"

      - name: Validate closure operator pack on latest main
        shell: bash
        run: |
          npm --prefix packages/video-closure-operator-pack run check
          npm --prefix packages/video-closure-operator-pack test

      - name: Validate M9 render readiness chain on latest main
        shell: bash
        run: |
          npm --prefix packages/mac-remotion-runner-client run check
          npm --prefix packages/mac-remotion-runner-client test
          npm --prefix packages/mac-remotion-render-job-binding run check
          npm --prefix packages/mac-remotion-render-job-binding test
          npm --prefix packages/mac-remotion-render-orchestration run check
          npm --prefix packages/mac-remotion-render-orchestration test

      - name: Run local DeepSeek advisory when already installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            echo "LOCAL_DEEPSEEK=NOT_INSTALLED"
            exit 0
          fi
          model="$(ollama list 2>/dev/null | awk 'NR>1 && tolower($1) ~ /deepseek/ {print $1; exit}')"
          if test -z "$model"; then
            echo "LOCAL_DEEPSEEK=NO_DEEPSEEK_MODEL"
            exit 0
          fi
          echo "LOCAL_DEEPSEEK_MODEL=$model"
          node packages/shared-macrunner-controller/src/cli.mjs prompt \
            --exact-head "$TOOLRADAR_EXACT_HEAD" \
            --profile m9-render-readiness \
            --output "$RUNNER_TEMP/toolradar-deepseek-prompt.txt"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ollama run "$model" < "$RUNNER_TEMP/toolradar-deepseek-prompt.txt" > "$RUNNER_TEMP/toolradar-deepseek-output.txt"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node packages/shared-macrunner-controller/src/cli.mjs deepseek-receipt \
            --exact-head "$TOOLRADAR_EXACT_HEAD" \
            --profile m9-render-readiness \
            --model "$model" \
            --model-output "$RUNNER_TEMP/toolradar-deepseek-output.txt" \
            --started-at "$started_at" \
            --completed-at "$completed_at" \
            --output "$RUNNER_TEMP/toolradar-deepseek-advisory-receipt.json"
          cat "$RUNNER_TEMP/toolradar-deepseek-advisory-receipt.json"

      - name: Upload secret-free receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolradar-shared-macrunner-main-${{ github.sha }}
          path: |
            ${{ runner.temp }}/toolradar-shared-macrunner-contract.json
            ${{ runner.temp }}/toolradar-deepseek-advisory-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized MacRunner receipt to PR 71
        if: always()
        uses: actions/github-script@v7
        env:
          TOOLRADAR_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const readJson = (name) => {
              const file = path.join(process.env.RUNNER_TEMP, name);
              if (!fs.existsSync(file)) return null;
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            };
            const mac = readJson('toolradar-shared-macrunner-contract.json');
            const deepseek = readJson('toolradar-deepseek-advisory-receipt.json');
            const body = [
              '### Shared MacRunner latest-main receipt',
              '',
              `- exact main: \`${context.sha}\``,
              `- run: \`${context.runId}\``,
              `- job status at receipt: \`${process.env.TOOLRADAR_JOB_STATUS}\``,
              `- MacRunner health: \`${mac?.health?.ok === true ? 'PASS' : mac ? 'FAIL' : 'NOT_REACHED'}\``,
              `- MacRunner operations observed: \`${mac?.operations?.length ?? 0}\``,
              `- MacRunner receipt digest: \`${mac?.receiptDigest ?? 'none'}\``,
              `- local DeepSeek: \`${deepseek ? 'RAN_ADVISORY_ONLY' : 'NOT_RUN_OR_NOT_INSTALLED'}\``,
              `- DeepSeek receipt digest: \`${deepseek?.receiptDigest ?? 'none'}\``,
              '- real render submitted: `false`',
              '- final MP4 claimed: `false`',
              '- publication/analytics write: `false`',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 71,
              body,
            });

      - name: Final exact-head and clean-tree proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLRADAR_EXACT_HEAD"
          test -z "$(git status --porcelain)"

      - name: Cleanup persistent MacRunner workspace
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/toolradar-shared-macrunner-contract.json" \
                "$RUNNER_TEMP/toolradar-deepseek-prompt.txt" \
                "$RUNNER_TEMP/toolradar-deepseek-output.txt" \
                "$RUNNER_TEMP/toolradar-deepseek-advisory-receipt.json" || true
          git reset --hard HEAD || true
          git clean -ffdx || true
