name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Publication confirmation syntax and contracts
        run: |
          npm --prefix packages/replit-publication-confirmation run check
          node --check apps/worker/src/confirm-replit-publication.mjs
          npm --prefix packages/replit-publication-confirmation test
          node --test packages/platform-publication-receipt-binding/test/platform-publication-receipt-binding.test.mjs
          npm --prefix packages/replit-release-preparation test
          npm --prefix packages/video-project-lifecycle test
      - name: Feedback completion syntax and contracts
        run: |
          npm --prefix packages/replit-feedback-completion run check
          node --check apps/worker/src/complete-replit-feedback.mjs
          npm --prefix packages/replit-feedback-completion test
          node --test packages/publication-analytics-observation-binding/test/index.test.mjs
          node --test packages/publication-analytics-observation-series/test/*.test.mjs
          node --test packages/publication-bounded-feedback-summary/test/*.test.mjs
      - run: npm run demo
