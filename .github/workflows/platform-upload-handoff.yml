name: platform-upload-handoff

on:
  pull_request:
    paths:
      - 'packages/platform-upload-handoff/**'
      - '.github/workflows/platform-upload-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check packages/platform-upload-handoff/src/index.mjs
      - name: Contract tests
        run: node --test packages/platform-upload-handoff/test/platform-upload-handoff.test.mjs
