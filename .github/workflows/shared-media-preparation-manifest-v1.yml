name: shared-media-preparation-manifest-v1

on:
  pull_request:
    branches: [main]
    paths:
      - packages/shared-media-preparation-manifest/**
      - .github/workflows/shared-media-preparation-manifest-v1.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head and pure preparation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f packages/shared-media-canonical-render-plan/src/index.mjs
          test -f packages/shared-media-preparation-manifest/src/index.mjs
          ! grep -RInE "from ['\"](node:fs|node:child_process|node:http|node:https|node:net|node:dgram)|\b(fetch|exec|execFile|spawn|fork)\s*\(" packages/shared-media-preparation-manifest/src
          ! grep -RInE 'POST /v1/render|render_existing|create_or_update|ACTION_TOKEN|Authorization|Bearer |edge-tts' packages/shared-media-preparation-manifest/src

      - name: Syntax check
        run: npm --prefix packages/shared-media-preparation-manifest run check

      - name: Run exact preparation contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/shared-media-preparation-manifest test | tee "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -Eq '# tests[[:space:]]+24$' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -Eq '# pass[[:space:]]+24$' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -Eq '# fail[[:space:]]+0$' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 'narration segments preserve shot timing and text' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 'auto captions bind exactly to narration timeline segments without execution' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 'synthesized voice without narration text fails closed' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 'auto captions without narration text fail closed in v1' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 're-signed narration tampering is rejected by timeline re-derivation' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 're-signed provided asset with invalid SHA is rejected semantically' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 're-signed source substitution can be internally self-consistent but exact render plan still rejects it' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"
          grep -F 'preparation compiler itself selects no concrete TTS, caption, Remotion or Mac transport implementation' "$RUNNER_TEMP/shared-media-preparation-manifest.tap"

      - name: Enforce truth boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'validateCanonicalRenderPlanV1(plan)' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'narrationSegmentsFromTimeline' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'generate_captions_from_narration_timeline' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'providerSelected: false' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'providerExecutionPerformed: false' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'preparedArtifactsProduced: false' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'transportSelected: false' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'bindingCreated: false' packages/shared-media-preparation-manifest/src/index.mjs
          grep -F 'renderAuthorized: false' packages/shared-media-preparation-manifest/src/index.mjs
          ! grep -RInE 'unitId|lessonId|studentId|teacherId|publicationAllowed|publicationPerformed|analyticsObserved|humanApproved' packages/shared-media-preparation-manifest/src

      - name: Emit exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          tap=(root/'shared-media-preparation-manifest.tap').read_text()
          def n(name):
              m=re.search(rf'^# {name}\s+(\d+)\s*$',tap,re.M)
              return int(m.group(1)) if m else None
          receipt={
            'schemaVersion':'shared-media.preparation-manifest-exact-head.v1',
            'exactHead':os.environ['TARGET_SHA'],
            'package':'@shared-media/preparation-manifest@0.1.0',
            'tests':n('tests'),'pass':n('pass'),'fail':n('fail'),
            'renderPlanValidationRequired':True,
            'exactRenderPlanSourceAuthorityRequired':True,
            'narrationRederivedFromTimeline':True,
            'voiceSegmentTieOutRequired':True,
            'captionSegmentTieOutRequired':True,
            'providedAssetShaRequired':True,
            'providerSelected':False,
            'providerExecutionPerformed':False,
            'preparedArtifactsProduced':False,
            'transportSelected':False,
            'bindingCreated':False,
            'renderAuthorized':False,
            'filesystemPerformed':False,
            'networkPerformed':False,
            'consumerDomainDecisionInferred':False,
            'businessOutcomeInferred':False,
            'testLogSha256':hashlib.sha256(tap.encode()).hexdigest(),
          }
          path=root/'shared-media-preparation-manifest-exact-head.json'
          path.write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: shared-media-preparation-manifest-v1
          path: |
            ${{ runner.temp }}/shared-media-preparation-manifest-exact-head.json
            ${{ runner.temp }}/shared-media-preparation-manifest.tap
          if-no-files-found: error
          retention-days: 30
