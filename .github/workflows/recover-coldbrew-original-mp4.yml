name: Recover cold brew original MP4

on:
  push:
    branches:
      - agent/recover-coldbrew-original-mp4-20260813

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Scan known local locations read-only
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/coldbrew-original-recovery"
          rm -rf "$OUT"
          mkdir -p "$OUT/files"
          MAN="$OUT/recovery-manifest.tsv"
          printf 'source\tduration_seconds\tbytes\tsha256\n' > "$MAN"

          roots=(
            "/Users/zhudapeng/Downloads"
            "/Users/zhudapeng/Desktop"
            "/Users/zhudapeng/Documents"
            "/Users/zhudapeng/Movies/RemotionActions"
            "/Users/zhudapeng/Movies"
            "/tmp"
          )
          exact=(
            "coldbrew-premium-camera-lock-v3.mp4"
            "coldbrew-premium-mature-full-v2.mp4"
            "coldbrew-v4-real-motion.mp4"
            "coldbrew-v4-polish.mp4"
            "coldbrew-v4-rc.mp4"
            "coldbrew-v4-beta.mp4"
            "coldbrew-v4-alpha.mp4"
            "final_video_coldbrew_1080x1920.mp4"
          )

          declare -A seen
          add_file() {
            local f="$1"
            [[ -f "$f" ]] || return 0
            local real dur bytes sha base dst
            real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$f")"
            [[ -n "${seen[$real]:-}" ]] && return 0
            seen[$real]=1
            dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" 2>/dev/null || true)"
            bytes="$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")"
            sha="$(shasum -a 256 "$f" | awk '{print $1}')"
            base="$(basename "$f")"
            dst="$OUT/files/${sha:0:12}-$base"
            cp -p "$f" "$dst"
            printf '%s\t%s\t%s\t%s\n' "$real" "$dur" "$bytes" "$sha" >> "$MAN"
          }

          for r in "${roots[@]}"; do
            [[ -d "$r" ]] || continue
            for n in "${exact[@]}"; do
              while IFS= read -r -d '' f; do add_file "$f"; done < <(find "$r" -type f -name "$n" -print0 2>/dev/null || true)
            done
          done

          for r in "${roots[@]}"; do
            [[ -d "$r" ]] || continue
            while IFS= read -r -d '' f; do
              dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" 2>/dev/null || true)"
              if python3 -c 'import sys; d=float(sys.argv[1]); raise SystemExit(0 if 30 <= d <= 34 else 1)' "$dur" 2>/dev/null; then
                add_file "$f"
              fi
            done < <(find "$r" -type f \( -iname '*coldbrew*.mp4' -o -iname '*cold-brew*.mp4' -o -iname '*cold_brew*.mp4' \) -print0 2>/dev/null || true)
          done

          echo "Recovered candidate count: $(find "$OUT/files" -type f | wc -l | tr -d ' ')"
          cat "$MAN"
          echo "RECOVERY_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Upload recovered candidates
        uses: actions/upload-artifact@v4
        with:
          name: coldbrew-original-recovery
          path: ${{ env.RECOVERY_DIR }}
          if-no-files-found: warn
          retention-days: 7
