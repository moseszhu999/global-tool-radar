name: publication-analytics-observation-binding

on:
  pull_request:
    paths:
      - 'packages/publication-analytics-observation-binding/**'
      - '.github/workflows/publication-analytics-observation-binding.yml'
  workflow_dispatch:

concurrency:
  group: publication-analytics-observation-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        working-directory: packages/publication-analytics-observation-binding
        run: npm run check
      - name: Contract tests
        working-directory: packages/publication-analytics-observation-binding
        run: npm test
