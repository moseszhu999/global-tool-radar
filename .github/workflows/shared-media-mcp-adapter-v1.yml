name: shared-media-mcp-adapter-v1

on:
  pull_request:
    branches: [main]
    paths:
      - packages/shared-media-mcp-adapter/**
      - .github/workflows/shared-media-mcp-adapter-v1.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head and scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "exact_head=$actual"
          count="$(grep -c "server.registerTool(" packages/shared-media-mcp-adapter/src/server.mjs)"
          test "$count" = "6"
          ! grep -Eq "registerTool\([^\n]*(execute_arbitrary_graph|shell|publish_social|clear_queue)" packages/shared-media-mcp-adapter/src/server.mjs
          ! grep -Eq "registerTool\([^\n]*tasks/" packages/shared-media-mcp-adapter/src/server.mjs

      - name: Install deterministic MCP dependencies from lock
        working-directory: packages/shared-media-mcp-adapter
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          printf 'true\n' > "$RUNNER_TEMP/package-lock-present-at-checkout.txt"
          npm ci --ignore-scripts --no-audit --no-fund
          shasum -a 256 package-lock.json | awk '{print $1}' > "$RUNNER_TEMP/package-lock.sha256"
          cp package-lock.json "$RUNNER_TEMP/shared-media-mcp-package-lock.json"
          npm ls --depth=0 | tee "$RUNNER_TEMP/shared-media-mcp-dependencies.txt"
          grep -F '@modelcontextprotocol/client@2.0.0' "$RUNNER_TEMP/shared-media-mcp-dependencies.txt"
          grep -F '@modelcontextprotocol/server@2.0.0' "$RUNNER_TEMP/shared-media-mcp-dependencies.txt"
          grep -F 'zod@4.2.0' "$RUNNER_TEMP/shared-media-mcp-dependencies.txt"

      - name: Syntax check
        working-directory: packages/shared-media-mcp-adapter
        run: npm run check

      - name: Controller and protocol-client contract tests
        working-directory: packages/shared-media-mcp-adapter
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/shared-media-mcp-tests.tap"
          grep -Eq '# fail 0|# fail[[:space:]]+0' "$RUNNER_TEMP/shared-media-mcp-tests.tap"
          grep -F 'legacy in-memory client lists and calls the six bounded MCP tools' "$RUNNER_TEMP/shared-media-mcp-tests.tap"
          grep -F 'modern stdio client negotiates 2026-07-28 and uses durable Shared Media jobs without tasks' "$RUNNER_TEMP/shared-media-mcp-tests.tap"

      - name: Emit exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])
          tap=(rt/'shared-media-mcp-tests.tap').read_text()
          deps=(rt/'shared-media-mcp-dependencies.txt').read_text()
          lock_sha=(rt/'package-lock.sha256').read_text().strip()
          def number(name):
              m=re.search(rf'^# {name}\s+(\d+)\s*$',tap,re.M)
              return int(m.group(1)) if m else None
          receipt={
            'schemaVersion':'toolradar.shared-media-mcp-adapter-exact-head.v2',
            'exactHead':os.environ['TARGET_SHA'],
            'mcpClientPackage':'@modelcontextprotocol/client@2.0.0',
            'mcpServerPackage':'@modelcontextprotocol/server@2.0.0',
            'zod':'4.2.0',
            'toolCount':6,
            'tests':number('tests'),
            'pass':number('pass'),
            'fail':number('fail'),
            'packageLockPresentAtCheckout':True,
            'packageLockSha256':lock_sha,
            'legacyInMemoryProtocolTest':True,
            'modern20260728StdioProtocolTest':True,
            'modernTasksDependency':False,
            'arbitraryGraphToolExposed':False,
            'publishingToolExposed':False,
            'realBackendBound':False,
            'realMacOperationPerformed':False,
            'humanApprovalInferred':False,
            'testLogSha256':hashlib.sha256(tap.encode()).hexdigest(),
            'dependencyLogSha256':hashlib.sha256(deps.encode()).hexdigest(),
          }
          (rt/'shared-media-mcp-exact-head-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: shared-media-mcp-adapter-exact-head
          path: |
            ${{ runner.temp }}/shared-media-mcp-exact-head-receipt.json
            ${{ runner.temp }}/shared-media-mcp-tests.tap
            ${{ runner.temp }}/shared-media-mcp-dependencies.txt
            ${{ runner.temp }}/shared-media-mcp-package-lock.json
          if-no-files-found: error
          retention-days: 30
