name: M10 Social Native Rescue v1

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - apps/remotion-video/src/social-native-rescue-v1.tsx
      - .github/workflows/m10-social-native-rescue-v1.yml

permissions:
  contents: read

jobs:
  render:
    name: Render social-native rescue candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_FRAMES: '990'
      EXPECTED_FPS: '30'
      EXPECTED_WIDTH: '1080'
      EXPECTED_HEIGHT: '1920'
      VOICE: zh-CN-XiaoxiaoNeural
      VOICE_RATE: '+10%'
    steps:
      - name: Validate candidate carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "moseszhu999/global-tool-radar"
          test "$GITHUB_HEAD_REF" = "feat/social-native-rescue-v1"

      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"

      - name: Install media, CJK font, and neural TTS tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk python3-pip
          sudo fc-cache -f
          fc-match 'Noto Sans CJK SC' | tee "$RUNNER_TEMP/cjk-font-match.txt"
          grep -F 'NotoSansCJK' "$RUNNER_TEMP/cjk-font-match.txt" >/dev/null
          python3 -m pip install --user --disable-pip-version-check edge-tts
          python3 -m edge_tts --help >/dev/null

      - name: Generate seven natural neural narration segments
        shell: bash
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/apps/remotion-video/public/assets/social-native-rescue-v1"
          mkdir -p "$dir"

          texts=(
            '这个页面，丑到我自己都不想点。看我怎么把它救回来。'
            '毛病就一个：所有东西都在抢注意力。按钮太多，颜色太多，没有重点。'
            '第一刀，砍信息。首页只留搜索、趋势和三个推荐。'
            '第二刀，砍颜色。背景、强调、成功，就三套。'
            '第三刀，只留一个主按钮。用户不用猜，到底该点哪儿。'
            '现在看前后。左边像功能仓库，右边才像一个你会继续逛的产品。'
            'AI不是替你审美，是让你更快试错。你会选左边还是右边？'
          )
          names=(01-hook 02-problem 03-cut-info 04-cut-color 05-one-cta 06-reveal 07-payoff)
          max_seconds=(4.45 5.45 4.45 3.95 4.45 5.45 4.45)

          : > "$RUNNER_TEMP/voice-durations.tsv"
          for i in "${!texts[@]}"; do
            mp3="$RUNNER_TEMP/${names[$i]}.mp3"
            wav="$dir/${names[$i]}.wav"
            python3 -m edge_tts --voice "$VOICE" --rate "$VOICE_RATE" --text "${texts[$i]}" --write-media "$mp3"
            ffmpeg -hide_banner -loglevel error -y -i "$mp3" -ar 48000 -ac 2 -c:a pcm_s16le "$wav"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$wav")"
            node -e 'const d=Number(process.argv[1]); const max=Number(process.argv[2]); if (!(d > 0.5 && d <= max)) { console.error(`segment duration ${d}s exceeds slot ${max}s`); process.exit(1); }' "$duration" "${max_seconds[$i]}"
            sha="$(sha256sum "$wav" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "${names[$i]}" "$duration" "$sha" | tee -a "$RUNNER_TEMP/voice-durations.tsv"
          done

      - name: Install Remotion dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd apps/remotion-video
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Create isolated social-native entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/remotion-video/src/social-native-entry.tsx <<'TSX'
          import React from 'react';
          import {Composition, registerRoot} from 'remotion';
          import {SOCIAL_NATIVE_RESCUE_FPS, SOCIAL_NATIVE_RESCUE_FRAMES, ToolRadarSocialNativeRescueV1} from './social-native-rescue-v1';

          const Root: React.FC = () => (
            <Composition
              id="ToolRadarSocialNativeRescueV1"
              component={ToolRadarSocialNativeRescueV1}
              durationInFrames={SOCIAL_NATIVE_RESCUE_FRAMES}
              fps={SOCIAL_NATIVE_RESCUE_FPS}
              width={1080}
              height={1920}
            />
          );

          registerRoot(Root);
          TSX

      - name: Bundle and verify candidate composition
        shell: bash
        run: |
          set -euo pipefail
          cd apps/remotion-video
          npx remotion compositions src/social-native-entry.tsx | tee "$RUNNER_TEMP/social-native-compositions.txt"
          grep -F 'ToolRadarSocialNativeRescueV1' "$RUNNER_TEMP/social-native-compositions.txt" >/dev/null
          grep -F '990' "$RUNNER_TEMP/social-native-compositions.txt" >/dev/null

      - name: Render first social-native candidate
        shell: bash
        run: |
          set -euo pipefail
          cd apps/remotion-video
          mkdir -p out
          npx remotion render src/social-native-entry.tsx ToolRadarSocialNativeRescueV1 out/toolradar-social-native-rescue-v1.mp4 --codec=h264 --crf=18
          test -s out/toolradar-social-native-rescue-v1.mp4

      - name: Run M10 technical preflight and create contact sheet
        shell: bash
        run: |
          set -euo pipefail
          video="$GITHUB_WORKSPACE/apps/remotion-video/out/toolradar-social-native-rescue-v1.mp4"
          ffprobe -v error -show_streams -show_format -of json "$video" > "$RUNNER_TEMP/social-native-ffprobe.json"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$video" > "$RUNNER_TEMP/social-native-frame-count.txt"
          ffmpeg -hide_banner -nostats -i "$video" -vf 'blackdetect=d=0.35:pix_th=0.10' -an -f null - 2> "$RUNNER_TEMP/social-native-blackdetect.txt" || true
          ffmpeg -hide_banner -nostats -i "$video" -af 'silencedetect=noise=-45dB:d=1.0' -vn -f null - 2> "$RUNNER_TEMP/social-native-silencedetect.txt" || true
          ffmpeg -hide_banner -loglevel error -y -i "$video" -vf "fps=1/4.1,scale=270:480,tile=2x4:padding=8:margin=8" -frames:v 1 "$RUNNER_TEMP/social-native-contact-sheet.jpg"

          VIDEO="$video" node --input-type=module <<'NODE'
          import {readFile, writeFile, stat} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const probe = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/social-native-ffprobe.json', 'utf8'));
          const videoStream = probe.streams.find((s) => s.codec_type === 'video');
          const audioStream = probe.streams.find((s) => s.codec_type === 'audio');
          if (!videoStream || !audioStream) throw new Error('candidate requires video and audio streams');
          if (Number(videoStream.width) !== Number(process.env.EXPECTED_WIDTH) || Number(videoStream.height) !== Number(process.env.EXPECTED_HEIGHT)) throw new Error('unexpected dimensions');
          const frames = Number((await readFile(process.env.RUNNER_TEMP + '/social-native-frame-count.txt', 'utf8')).trim());
          if (frames !== Number(process.env.EXPECTED_FRAMES)) throw new Error(`unexpected frame count ${frames}`);
          const videoDuration = frames / Number(process.env.EXPECTED_FPS);
          const containerDuration = Number(probe.format?.duration);
          if (!(containerDuration >= videoDuration && containerDuration < videoDuration + 0.15)) throw new Error(`unexpected container duration ${containerDuration}`);
          const bytes = await readFile(process.env.VIDEO);
          const receipt = {
            schemaVersion: 'toolradar.m10.social-native-rescue-candidate.v1',
            exactCandidateHead: process.env.GITHUB_SHA,
            format: '9:16 portrait',
            contentPattern: 'hook -> problem -> three cuts -> before/after reveal -> question',
            selectedVoice: process.env.VOICE,
            voiceRate: process.env.VOICE_RATE,
            outputFilename: 'toolradar-social-native-rescue-v1.mp4',
            outputSha256: createHash('sha256').update(bytes).digest('hex'),
            outputBytes: (await stat(process.env.VIDEO)).size,
            frames,
            fps: Number(process.env.EXPECTED_FPS),
            durationSeconds: videoDuration,
            containerDurationSeconds: containerDuration,
            width: Number(videoStream.width),
            height: Number(videoStream.height),
            technicalMediaIntegrityPassed: true,
            socialPlatformBusinessFitApprovedByHuman: false,
            humanWatchedFullCandidate: false,
            publicationAllowed: false,
            publicationPerformed: false,
            analyticsObserved: false,
          };
          await writeFile(process.env.RUNNER_TEMP + '/social-native-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

          if grep -F 'black_start:' "$RUNNER_TEMP/social-native-blackdetect.txt" >/dev/null; then
            echo 'Detected black interval >=0.35s' >&2
            cat "$RUNNER_TEMP/social-native-blackdetect.txt" >&2
            exit 1
          fi

      - name: Upload social-native candidate
        uses: actions/upload-artifact@v4
        with:
          name: toolradar-social-native-rescue-v1
          path: |
            apps/remotion-video/out/toolradar-social-native-rescue-v1.mp4
            ${{ runner.temp }}/social-native-contact-sheet.jpg
            ${{ runner.temp }}/social-native-receipt.json
            ${{ runner.temp }}/social-native-ffprobe.json
            ${{ runner.temp }}/social-native-frame-count.txt
            ${{ runner.temp }}/social-native-blackdetect.txt
            ${{ runner.temp }}/social-native-silencedetect.txt
            ${{ runner.temp }}/voice-durations.tsv
            ${{ runner.temp }}/cjk-font-match.txt
          if-no-files-found: error
          retention-days: 14
