name: publication-analytics-observation-series

on:
  pull_request:
    paths:
      - 'packages/publication-analytics-observation-series/**'
      - '.github/workflows/publication-analytics-observation-series.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and contract tests
        run: npm --prefix packages/publication-analytics-observation-series run check
