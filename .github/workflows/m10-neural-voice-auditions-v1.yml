name: M10 Neural Mandarin Voice Auditions v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/m10-neural-voice-auditions-v1.yml

permissions:
  contents: read

jobs:
  audition:
    name: Generate natural neural Mandarin audition tracks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOOLRADAR_SOURCE_HEAD: 1a32260cb6bd84542d3a3f306e915e0ab003c36d
      INTER_SHOT_PAUSE_SECONDS: '0.10'
    steps:
      - name: Validate temporary carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "moseszhu999/global-tool-radar"
          test "$GITHUB_HEAD_REF" = "ci/m10-neural-voice-auditions-v1"

      - name: Checkout exact ToolRadar source
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/global-tool-radar
          ref: 1a32260cb6bd84542d3a3f306e915e0ab003c36d
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Install audio and neural TTS runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input edge-tts
          command -v ffmpeg
          command -v ffprobe
          edge-tts --list-voices > "$RUNNER_TEMP/edge-voices.txt"
          grep -F 'zh-CN-XiaoxiaoNeural' "$RUNNER_TEMP/edge-voices.txt" >/dev/null
          grep -F 'zh-CN-YunyangNeural' "$RUNNER_TEMP/edge-voices.txt" >/dev/null
          python3 - <<'PY'
          import importlib.metadata
          print('edge_tts_version=' + importlib.metadata.version('edge-tts'))
          PY

      - name: Extract seven narration shots
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/source"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$TOOLRADAR_SOURCE_HEAD"
          work="$RUNNER_TEMP/toolradar-neural-voice-v1"
          mkdir -p "$work"
          SOURCE_DIR="$source_dir" WORK="$work" node --input-type=module <<'NODE'
          import {readFile, writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          const pkg = JSON.parse(await readFile(join(process.env.SOURCE_DIR, 'apps/web/data/ai-design-workflow-storyboard-package.json'), 'utf8'));
          const shots = pkg?.storyboard?.shots ?? [];
          if (shots.length !== 7) throw new Error(`expected 7 shots, got ${shots.length}`);
          if ((pkg?.assetManifest?.captureTasks ?? []).length !== 0) throw new Error('unexpected capture dependency');
          for (let i = 0; i < 7; i += 1) {
            const text = String(shots[i]?.narrationText ?? '').trim();
            if (!text || /replit/i.test(text)) throw new Error(`invalid narration shot ${i + 1}`);
            await writeFile(join(process.env.WORK, `shot-${String(i + 1).padStart(2, '0')}.txt`), `${text}\n`);
          }
          NODE

      - name: Generate Xiaoxiao and Yunyang candidates without time stretching
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/toolradar-neural-voice-v1"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'anullsrc=r=48000:cl=mono' -t "$INTER_SHOT_PAUSE_SECONDS" -c:a pcm_s16le "$work/pause.wav"

          build() {
            slug="$1"; voice="$2"
            : > "$work/${slug}-segments.tsv"
            : > "$work/${slug}-concat.txt"
            for n in 01 02 03 04 05 06 07; do
              text="$(cat "$work/shot-$n.txt")"
              edge-tts --voice "$voice" --rate=-2% --text "$text" --write-media "$work/${slug}-shot-$n.mp3"
              ffmpeg -hide_banner -loglevel error -y -i "$work/${slug}-shot-$n.mp3" -ar 48000 -ac 1 -c:a pcm_s16le "$work/${slug}-shot-$n.wav"
              sec="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$work/${slug}-shot-$n.wav")"
              node -e 'const d=Number(process.argv[1]); if(!(d>3&&d<30)) process.exit(1)' "$sec"
              printf '%s\t%s\n' "$n" "$sec" >> "$work/${slug}-segments.tsv"
              printf "file '%s'\n" "$work/${slug}-shot-$n.wav" >> "$work/${slug}-concat.txt"
              if [ "$n" != '07' ]; then printf "file '%s'\n" "$work/pause.wav" >> "$work/${slug}-concat.txt"; fi
            done
            ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i "$work/${slug}-concat.txt" -c:a pcm_s16le "$work/${slug}-raw.wav"
            ffmpeg -hide_banner -loglevel error -y -i "$work/${slug}-raw.wav" -af 'loudnorm=I=-16:LRA=7:TP=-1.5' -ar 48000 -ac 1 -c:a pcm_s16le "$work/toolradar-${slug}-v1.wav"
            ffmpeg -hide_banner -loglevel error -y -i "$work/toolradar-${slug}-v1.wav" -c:a aac -b:a 192k "$work/toolradar-${slug}-v1.m4a"
            sec="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$work/toolradar-${slug}-v1.wav")"
            node -e 'const d=Number(process.argv[1]); if(!(d>60&&d<130)) process.exit(1)' "$sec"
            ffmpeg -hide_banner -nostats -i "$work/toolradar-${slug}-v1.wav" -af 'silencedetect=noise=-45dB:d=0.35' -f null - 2> "$work/${slug}-silence.txt" || true
            echo "$slug duration=$sec"
            sha256sum "$work/toolradar-${slug}-v1.wav" "$work/toolradar-${slug}-v1.m4a"
          }

          build xiaoxiao zh-CN-XiaoxiaoNeural
          build yunyang zh-CN-YunyangNeural

      - name: Write audition boundary receipt
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/toolradar-neural-voice-v1"
          WORK="$work" node --input-type=module <<'NODE'
          import {readFile, writeFile, stat} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {join} from 'node:path';
          const sha = async p => createHash('sha256').update(await readFile(p)).digest('hex');
          const one = async (slug, voice) => {
            const wav = join(process.env.WORK, `toolradar-${slug}-v1.wav`);
            const m4a = join(process.env.WORK, `toolradar-${slug}-v1.m4a`);
            const rows = (await readFile(join(process.env.WORK, `${slug}-segments.tsv`), 'utf8')).trim().split('\n').map(line => {
              const [shot, seconds] = line.split('\t'); return {shot:Number(shot), durationSeconds:Number(seconds)};
            });
            const silence = await readFile(join(process.env.WORK, `${slug}-silence.txt`), 'utf8');
            const gaps = [...silence.matchAll(/silence_duration: ([0-9.]+)/g)].map(m=>Number(m[1]));
            return {slug,voice,engine:'edge-tts',rate:'-2%',atempoApplied:false,globalTimeStretchApplied:false,fixed89SecondTargetApplied:false,segments:rows,durationSeconds:Number(execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',wav],{encoding:'utf8'}).trim()),silenceIntervalsAtLeast350ms:gaps.length,maximumSilenceSeconds:gaps.length?Math.max(...gaps):0,wavSha256:await sha(wav),wavBytes:(await stat(wav)).size,m4aSha256:await sha(m4a),m4aBytes:(await stat(m4a)).size};
          };
          const receipt={schemaVersion:'toolradar.m10-neural-voice-auditions.v1',exactToolRadarSourceHead:process.env.TOOLRADAR_SOURCE_HEAD,serviceBoundary:'Microsoft neural speech via edge-tts; no login or publication',candidates:[await one('xiaoxiao','zh-CN-XiaoxiaoNeural'),await one('yunyang','zh-CN-YunyangNeural')],humanAudioApproved:false,fullVideoRerendered:false,publicationAllowed:false,publicationPerformed:false};
          await writeFile(join(process.env.WORK,'toolradar-m10-neural-voice-auditions-v1-receipt.json'),JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE

      - name: Upload human-audition artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolradar-m10-neural-voice-auditions-v1
          path: |
            ${{ runner.temp }}/toolradar-neural-voice-v1/toolradar-xiaoxiao-v1.wav
            ${{ runner.temp }}/toolradar-neural-voice-v1/toolradar-xiaoxiao-v1.m4a
            ${{ runner.temp }}/toolradar-neural-voice-v1/toolradar-yunyang-v1.wav
            ${{ runner.temp }}/toolradar-neural-voice-v1/toolradar-yunyang-v1.m4a
            ${{ runner.temp }}/toolradar-neural-voice-v1/toolradar-m10-neural-voice-auditions-v1-receipt.json
            ${{ runner.temp }}/toolradar-neural-voice-v1/*-segments.tsv
            ${{ runner.temp }}/toolradar-neural-voice-v1/*-silence.txt
          if-no-files-found: error
          retention-days: 30
