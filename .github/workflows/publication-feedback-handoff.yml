name: publication-feedback-handoff

on:
  pull_request:
    paths:
      - 'packages/publication-feedback-handoff/**'
      - '.github/workflows/publication-feedback-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publication feedback handoff
        run: npm --prefix packages/publication-feedback-handoff run check
