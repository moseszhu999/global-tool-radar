name: youtube-rss-pilot

on:
  pull_request:
    paths:
      - ".github/workflows/youtube-rss-pilot.yml"
      - "apps/worker/src/capture-youtube-rss-pilot.mjs"
      - "packages/youtube-rss-pilot/**"
      - "packages/youtube-rss-resilience/**"
      - "packages/connectors/youtube-rss/**"
      - "packages/metadata-candidates/**"
      - "config/youtube-watchlist.v1.json"
      - "package.json"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: youtube-rss-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Capture public YouTube RSS evidence
        id: capture
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm run pilot:youtube-rss
        env:
          TOOLRADAR_PILOT_OUTPUT: out/youtube-rss-pilot.json
          TOOLRADAR_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLRADAR_CAPTURE_RUN_ID: ${{ github.run_id }}
          TOOLRADAR_RSS_MINIMUM_SUCCESS_RATIO: "0.8"
      - name: Upload pilot evidence
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: toolradar-youtube-rss-pilot-${{ github.sha }}
          path: out/youtube-rss-pilot.json
          if-no-files-found: error
          retention-days: 14
