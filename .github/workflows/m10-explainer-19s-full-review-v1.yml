name: M10 Explainer 19s Full Review v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/m10-explainer-19s-full-review-v1.yml

permissions:
  contents: read

jobs:
  full-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOICE: zh-CN-XiaoxiaoNeural
      VOICE_RATE: '+12%'
      SOURCE_FILE: apps/remotion-video/src/toolradar-explainer-19s-animatic-v1.tsx
      WORKSPACE_FILE: apps/web/workspace.html
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source, anchors, and product truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          grep -F 'EXPLAINER_19S_FRAMES = 576' "$SOURCE_FILE"
          grep -F 'EXPLAINER_19S_FIRST_PAYOFF_FRAME = 156' "$SOURCE_FILE"
          grep -F 'EXPLAINER_19S_FULL_REVEAL_FRAME = 312' "$SOURCE_FILE"
          grep -F 'EXPLAINER_19S_LOOP_START_FRAME = 528' "$SOURCE_FILE"
          grep -F '<strong>Radar inbox</strong>' "$WORKSPACE_FILE"
          grep -F '<small>候选</small><strong data-count>UNKNOWN</strong>' "$WORKSPACE_FILE"
          grep -F '<small>版权待审</small><strong data-rights>UNKNOWN</strong>' "$WORKSPACE_FILE"
          grep -F '<small>安全待审</small><strong data-security>UNKNOWN</strong>' "$WORKSPACE_FILE"
          grep -F '缺失不会显示为 0。' "$WORKSPACE_FILE"
          grep -F '只生成 draft，不下载、复制或发布源视频。' "$WORKSPACE_FILE"

      - name: Install media, deterministic font, and TTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk python3-pip
          sudo fc-cache -f
          python3 -m pip install --user --disable-pip-version-check edge-tts
          font="$(fc-match -f '%{file}\n' 'Noto Sans CJK SC' | head -1)"
          test -f "$font"
          printf '%s\n' "$font" > "$RUNNER_TEMP/font-path.txt"
          printf '%s\n' 'REAL WORKSPACE PROOF' > "$RUNNER_TEMP/proof-badge.txt"
          printf '%s\n' 'Radar inbox' > "$RUNNER_TEMP/proof-title.txt"
          printf '%s\n' '候选' > "$RUNNER_TEMP/label-candidate.txt"
          printf '%s\n' '版权待审' > "$RUNNER_TEMP/label-rights.txt"
          printf '%s\n' '安全待审' > "$RUNNER_TEMP/label-security.txt"
          printf '%s\n' 'UNKNOWN' > "$RUNNER_TEMP/value-unknown.txt"
          printf '%s\n' '缺失不会显示为 0' > "$RUNNER_TEMP/proof-note.txt"

      - name: Render exact structural animatic
        working-directory: apps/remotion-video
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx remotion browser ensure
          mkdir -p out
          npx remotion render src/toolradar-explainer-19s-animatic-v1.tsx ToolRadarExplainer19sAnimaticV1 out/explainer-full-review-base.mp4 --codec=h264 --crf=19
          test -s out/explainer-full-review-base.mp4

      - name: Insert bounded truthful Workspace proof
        shell: bash
        run: |
          set -euo pipefail
          font="$(cat "$RUNNER_TEMP/font-path.txt")"
          base="$GITHUB_WORKSPACE/apps/remotion-video/out/explainer-full-review-base.mp4"
          proof="$GITHUB_WORKSPACE/apps/remotion-video/out/explainer-full-review-proof.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$base" \
            -vf "\
              drawbox=x=124:y=1242:w=832:h=470:color=0xF8FBFF@0.98:t=fill:enable='between(t,6.10,7.72)',\
              drawbox=x=124:y=1242:w=12:h=470:color=0x5DE2F2@1:t=fill:enable='between(t,6.10,7.72)',\
              drawbox=x=158:y=1280:w=270:h=44:color=0x0B2238@1:t=fill:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/proof-badge.txt':fontcolor=0x5DE2F2:fontsize=19:x=176:y=1290:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/proof-title.txt':fontcolor=0x071421:fontsize=36:x=158:y=1347:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/label-candidate.txt':fontcolor=0x526B83:fontsize=22:x=165:y=1424:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/value-unknown.txt':fontcolor=0xE5A827:fontsize=26:x=165:y=1460:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/label-rights.txt':fontcolor=0x526B83:fontsize=22:x=416:y=1424:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/value-unknown.txt':fontcolor=0xE5A827:fontsize=26:x=416:y=1460:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/label-security.txt':fontcolor=0x526B83:fontsize=22:x=696:y=1424:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/value-unknown.txt':fontcolor=0xE5A827:fontsize=26:x=696:y=1460:enable='between(t,6.10,7.72)',\
              drawbox=x=158:y=1537:w=764:h=2:color=0xDDE7F0@1:t=fill:enable='between(t,6.10,7.72)',\
              drawtext=fontfile='$font':textfile='$RUNNER_TEMP/proof-note.txt':fontcolor=0x1F3B52:fontsize=25:x=158:y=1570:enable='between(t,6.10,7.72)'" \
            -an -c:v libx264 -crf 19 -pix_fmt yuv420p -movflags +faststart "$proof"
          test -s "$proof"

      - name: Synthesize six natural narration beats
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/narration"; mkdir -p "$dir"
          texts=(
            '结果，只留五个。'
            '先筛掉噪声，再留下焦点。'
            '没有证据，就保持未知。'
            '顺序一变，立刻更清楚。'
            '升级，不是加，是敢删。'
            'Agent 可以提议，但决定要交给人。'
          )
          names=(01-after 02-filter 03-evidence 04-reveal 05-reduce 06-human)
          maxes=(2.30 2.90 2.60 2.60 2.90 4.20)
          : > "$RUNNER_TEMP/narration-durations.tsv"
          for i in "${!texts[@]}"; do
            mp3="$dir/${names[$i]}.mp3"; wav="$dir/${names[$i]}.wav"; ok=0
            for attempt in 1 2 3; do
              if python3 -m edge_tts --voice "$VOICE" --rate "$VOICE_RATE" --text "${texts[$i]}" --write-media "$mp3" && test -s "$mp3"; then ok=1; break; fi
              rm -f "$mp3"; sleep $((attempt*2))
            done
            test "$ok" -eq 1
            ffmpeg -hide_banner -loglevel error -y -i "$mp3" -ar 48000 -ac 2 -c:a pcm_s16le "$wav"
            dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$wav")"
            python3 - "$dur" "${maxes[$i]}" "${names[$i]}" <<'PY'
          import sys
          d=float(sys.argv[1]); m=float(sys.argv[2]); n=sys.argv[3]
          if d>m: raise SystemExit(f'{n} narration too long: {d:.3f}s > {m:.3f}s')
          PY
            printf '%s\t%s\t%s\n' "${names[$i]}" "$dur" "${maxes[$i]}" >> "$RUNNER_TEMP/narration-durations.tsv"
          done
          printf '07-loop\tNONVERBAL\t1.60\n' >> "$RUNNER_TEMP/narration-durations.tsv"

      - name: Generate procedural music and semantic SFX
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/bgm.wav" <<'PY'
          import array,math,sys,wave
          out=sys.argv[1]; rate=48000; duration=19.2; n=int(rate*duration); bpm=118.; beat=60./bpm
          roots=(98.,110.,130.81,116.54); buf=array.array('h')
          for j in range(n):
              t=j/rate; root=roots[int(t//4.8)%len(roots)]
              pad=(math.sin(2*math.pi*root*t)+.42*math.sin(2*math.pi*root*1.5*t)+.24*math.sin(2*math.pi*root*2*t))*.036
              bp=t%beat; kick=math.sin(2*math.pi*(72-24*min(1,bp/.13))*bp)*math.exp(-29*bp)*.20 if bp<.15 else 0.
              hb=t%(beat/2); hat=math.sin(2*math.pi*5200*t)*math.sin(2*math.pi*3100*t)*math.exp(-74*hb)*.032 if hb<.055 else 0.
              lift=.013*math.sin(2*math.pi*(196 if int(t/beat)%4<2 else 220)*t)
              v=max(-.75,min(.75,pad+kick+hat+lift)); s=int(v*32767); buf.append(s); buf.append(s)
          with wave.open(out,'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate); w.writeframes(buf.tobytes())
          PY
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'anoisesrc=color=pink:sample_rate=48000:duration=0.42' -af 'highpass=f=600,lowpass=f=6500,afade=t=in:st=0:d=0.02,afade=t=out:st=0.13:d=0.28,volume=0.18' -ac 2 -c:a pcm_s16le "$RUNNER_TEMP/whoosh.wav"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=82:sample_rate=48000:duration=0.28' -af 'afade=t=out:st=0.04:d=0.24,volume=0.55' -ac 2 -c:a pcm_s16le "$RUNNER_TEMP/impact.wav"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=1180:sample_rate=48000:duration=0.10' -af 'afade=t=out:st=0.015:d=0.085,volume=0.22' -ac 2 -c:a pcm_s16le "$RUNNER_TEMP/click.wav"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=1420:sample_rate=48000:duration=0.46' -af 'aecho=0.8:0.35:38|76:0.28|0.15,afade=t=out:st=0.18:d=0.28,volume=0.12' -ac 2 -c:a pcm_s16le "$RUNNER_TEMP/sparkle.wav"

      - name: Mix full review audio onto truthful proof video
        shell: bash
        run: |
          set -euo pipefail
          n="$RUNNER_TEMP/narration"
          proof="$GITHUB_WORKSPACE/apps/remotion-video/out/explainer-full-review-proof.mp4"
          out="$GITHUB_WORKSPACE/apps/remotion-video/out/toolradar-explainer-19s-full-review-v1.mp4"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$proof" -i "$RUNNER_TEMP/bgm.wav" \
            -i "$n/01-after.wav" -i "$n/02-filter.wav" -i "$n/03-evidence.wav" -i "$n/04-reveal.wav" -i "$n/05-reduce.wav" -i "$n/06-human.wav" \
            -i "$RUNNER_TEMP/whoosh.wav" -i "$RUNNER_TEMP/impact.wav" -i "$RUNNER_TEMP/click.wav" -i "$RUNNER_TEMP/sparkle.wav" \
            -filter_complex "\
              [1:a]volume=0.24[bg];\
              [2:a]adelay=0|0[n1];[3:a]adelay=2300|2300[n2];[4:a]adelay=5200|5200[n3];[5:a]adelay=7800|7800[n4];[6:a]adelay=10400|10400[n5];[7:a]adelay=13300|13300[n6];\
              [8:a]adelay=3200|3200,volume=0.9[w1];[8:a]adelay=17600|17600,volume=0.95[w2];\
              [9:a]adelay=5200|5200[i1];[9:a]adelay=10400|10400,volume=0.78[i2];\
              [10:a]adelay=6500|6500[c1];[10:a]adelay=15000|15000[c2];[11:a]adelay=10100|10100[s1];\
              [bg][n1][n2][n3][n4][n5][n6][w1][w2][i1][i2][c1][c2][s1]amix=inputs=14:duration=longest:normalize=0,loudnorm=I=-16:TP=-1.5:LRA=11[mix]" \
            -map 0:v:0 -map '[mix]' -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -t 19.2 -movflags +faststart "$out"
          test -s "$out"

      - name: Exact media and truth-boundary inspection
        shell: bash
        run: |
          set -euo pipefail
          video="$GITHUB_WORKSPACE/apps/remotion-video/out/toolradar-explainer-19s-full-review-v1.mp4"
          ffprobe -v error -show_streams -show_format -of json "$video" > "$RUNNER_TEMP/ffprobe.json"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$video" > "$RUNNER_TEMP/frame-count.txt"
          ffmpeg -hide_banner -nostats -i "$video" -vf 'blackdetect=d=0.35:pix_th=0.10' -an -f null - 2> "$RUNNER_TEMP/blackdetect.txt" || true
          ffmpeg -hide_banner -nostats -i "$video" -af 'silencedetect=noise=-45dB:d=0.75' -vn -f null - 2> "$RUNNER_TEMP/silencedetect.txt" || true
          ffmpeg -hide_banner -nostats -i "$video" -af 'loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json' -f null - 2> "$RUNNER_TEMP/loudness.txt" || true
          ffmpeg -hide_banner -loglevel error -y -i "$video" -vf 'fps=1/1.6,scale=270:480,tile=3x4:padding=8:margin=8' -frames:v 1 "$RUNNER_TEMP/contact-sheet.jpg"
          VIDEO="$video" PR_HEAD="${{ github.event.pull_request.head.sha }}" python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          rt=pathlib.Path(os.environ['RUNNER_TEMP']); probe=json.loads((rt/'ffprobe.json').read_text())
          vs=next(s for s in probe['streams'] if s['codec_type']=='video'); au=next(s for s in probe['streams'] if s['codec_type']=='audio')
          frames=int((rt/'frame-count.txt').read_text().strip()); assert frames==576
          assert int(vs['width'])==1080 and int(vs['height'])==1920
          assert 'black_start:' not in (rt/'blackdetect.txt').read_text(errors='ignore')
          assert 'silence_start:' not in (rt/'silencedetect.txt').read_text(errors='ignore')
          loud=(rt/'loudness.txt').read_text(errors='ignore')
          def metric(name):
              m=re.search(rf'"{name}"\s*:\s*"?(-?\d+(?:\.\d+)?)',loud)
              return float(m.group(1)) if m else None
          data=pathlib.Path(os.environ['VIDEO']).read_bytes()
          receipt={
            'schemaVersion':'toolradar.m10.explainer-19s-full-review.v1',
            'exactHead':os.environ['PR_HEAD'],
            'durationSeconds':19.2,
            'frames':576,'fps':30,'width':1080,'height':1920,
            'firstPayoffSeconds':5.2,'fullRevealSeconds':10.4,'loopStartSeconds':17.6,
            'deterministicProductProofUsed':True,
            'productProofSource':'apps/web/workspace.html',
            'proofWindowSeconds':[6.10,7.72],
            'generatedFactualUiUsed':False,
            'voice':os.environ['VOICE'],'voiceRate':os.environ['VOICE_RATE'],
            'narratedBeatCount':6,'loopBeatNarrationIncluded':False,
            'perBeatSynthesis':True,'narrationTimeStretchApplied':False,
            'proceduralMusicIncluded':True,'semanticSfx':['whoosh','impact','click','sparkle'],
            'videoCodec':vs['codec_name'],'audioCodec':au['codec_name'],
            'integratedLoudnessMeasured':metric('input_i'),'truePeakMeasured':metric('input_tp'),
            'blackIntervalAtLeast035s':False,'silenceIntervalAtLeast075s':False,
            'outputSha256':hashlib.sha256(data).hexdigest(),'outputBytes':len(data),
            'canonicalPR89CandidateReplaced':False,
            'humanWatchedFullCandidate':False,
            'socialPlatformBusinessFitApprovedByHuman':False,
            'publicationAllowed':False,'publicationPerformed':False,'analyticsObserved':False,
          }
          (rt/'full-review-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Upload full-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: toolradar-explainer-19s-full-review-v1
          path: |
            apps/remotion-video/out/toolradar-explainer-19s-full-review-v1.mp4
            ${{ runner.temp }}/contact-sheet.jpg
            ${{ runner.temp }}/full-review-receipt.json
            ${{ runner.temp }}/narration-durations.tsv
            ${{ runner.temp }}/ffprobe.json
            ${{ runner.temp }}/blackdetect.txt
            ${{ runner.temp }}/silencedetect.txt
            ${{ runner.temp }}/loudness.txt
          if-no-files-found: error
          retention-days: 30
