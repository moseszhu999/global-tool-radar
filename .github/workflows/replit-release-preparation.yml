name: replit-release-preparation

on:
  pull_request:
    paths:
      - 'packages/replit-release-preparation/**'
      - '.github/workflows/replit-release-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: npm --prefix packages/replit-release-preparation run check
      - name: Contracts
        run: npm --prefix packages/replit-release-preparation test
