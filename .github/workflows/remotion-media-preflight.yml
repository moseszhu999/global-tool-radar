name: remotion-media-preflight

on:
  pull_request:
    paths:
      - 'packages/remotion-media-preflight/**'
      - '.github/workflows/remotion-media-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check packages/remotion-media-preflight/src/index.mjs
      - name: Contract tests
        run: node --test packages/remotion-media-preflight/test/index.test.mjs
